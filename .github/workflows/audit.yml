name: Auditoria dados
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolver e puxar env
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          AUTH="Authorization: Bearer $VERCEL_TOKEN"
          ORG_ID=$(curl -s "https://api.vercel.com/v2/teams?limit=100" -H "$AUTH" | jq -r '.teams[]? | select(.slug=="bibit-marketing") | .id')
          PROJECT_ID=$(curl -s "https://api.vercel.com/v9/projects?teamId=$ORG_ID&search=bibit-operacao" -H "$AUTH" | jq -r '.projects[0].id')
          echo "VERCEL_ORG_ID=$ORG_ID" >> $GITHUB_ENV
          echo "VERCEL_PROJECT_ID=$PROJECT_ID" >> $GITHUB_ENV
          npx vercel@latest pull --yes --environment=production --token=$VERCEL_TOKEN
      - name: Auditar ClickUp
        run: |
          CK=$(grep -m1 '^CLICKUP_TOKEN=' .vercel/.env.production.local | cut -d= -f2- | tr -d '"')
          H="Authorization: $CK"
          mkdir -p /tmp/a
          for SP in 90175562413 90175576608 90175021734 90175231029; do
            curl -s "https://api.clickup.com/api/v2/space/$SP/list?archived=false" -H "$H" > /tmp/a/sl_$SP.json
            curl -s "https://api.clickup.com/api/v2/space/$SP/folder?archived=false" -H "$H" > /tmp/a/sf_$SP.json
          done
          jq -s '{listas_soltas:[.[0,2,4,6].lists[]?|{id,name,space:.space.name}], pastas:[.[1,3,5,7].folders[]?|{id,name,space:.space.name,listas:[.lists[]?|{id,name}]}]}' \
            /tmp/a/sl_90175562413.json /tmp/a/sf_90175562413.json /tmp/a/sl_90175576608.json /tmp/a/sf_90175576608.json \
            /tmp/a/sl_90175021734.json /tmp/a/sf_90175021734.json /tmp/a/sl_90175231029.json /tmp/a/sf_90175231029.json > estrutura.json
          ALVO=$(jq -r '[.listas_soltas[], (.pastas[].listas[])] | map(select(.name|test("pagar|contas|comiss|financ";"i"))) | .[0].id // empty' estrutura.json)
          echo "lista alvo: $ALVO"
          if [ -n "$ALVO" ]; then
            curl -s "https://api.clickup.com/api/v2/list/$ALVO/task?include_closed=true&subtasks=true&page=0" -H "$H" > contas.json
          else
            echo '{"tasks":[]}' > contas.json
          fi
          curl -s "https://api.clickup.com/api/v2/list/901713519081/task?include_closed=true&subtasks=true&page=0" -H "$H" \
            | jq '{tasks:[.tasks[]|{id,name,parent,status:.status.status,date_closed,due_date,date_created,cf:[.custom_fields[]|select(.value!=null)|{id,name,value}]}]}' > crossell.json
          jq '{tasks:[.tasks[]?|{id,name,parent,status:.status.status,date_closed,due_date,date_created,cf:[.custom_fields[]?|select(.value!=null)|{id,name,value}]}]}' contas.json > contas_min.json
          mv contas_min.json contas.json
          wc -c estrutura.json crossell.json contas.json
      - name: Commitar auditoria
        run: |
          git config user.name audit-bot; git config user.email audit@bibit
          git add estrutura.json crossell.json contas.json
          git commit -m "auditoria de dados [skip ci]" || true
          git push || true
