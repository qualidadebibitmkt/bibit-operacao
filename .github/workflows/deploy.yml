name: Deploy Vercel
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checar token Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          AUTH="Authorization: Bearer $VERCEL_TOKEN"
          U=$(curl -s "https://api.vercel.com/v2/user" -H "$AUTH")
          echo "$U" | jq -r '"conta: \(.user.username // "?")  |  email: \(.user.email // "?")  |  nome: \(.user.name // "?")"' | tee /tmp/quem.txt
          echo "vercel_auth_http=200" >> $GITHUB_ENV

      - name: Resolver time e projeto
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          AUTH="Authorization: Bearer $VERCEL_TOKEN"
          LOG=/tmp/resolve.log
          TEAMS=$(curl -s "https://api.vercel.com/v2/teams?limit=100" -H "$AUTH")
          echo "times: $(echo "$TEAMS" | jq -r '[.teams[]?.slug] | join(",")')" | tee -a $LOG
          ORG_ID=$(echo "$TEAMS" | jq -r '.teams[]? | select(.slug=="bibit-marketing") | .id')
          [ -z "$ORG_ID" ] && ORG_ID=$(echo "$TEAMS" | jq -r '.teams[0]?.id // empty')
          PROJECT_ID=""
          if [ -n "$ORG_ID" ]; then
            PROJS=$(curl -s "https://api.vercel.com/v9/projects?teamId=$ORG_ID&search=bibit-operacao" -H "$AUTH")
            PROJECT_ID=$(echo "$PROJS" | jq -r '.projects[]? | select(.name | test("bibit-operacao")) | .id' | head -n1)
          fi
          if [ -z "$PROJECT_ID" ]; then
            PROJS=$(curl -s "https://api.vercel.com/v9/projects?search=bibit-operacao" -H "$AUTH")
            PROJECT_ID=$(echo "$PROJS" | jq -r '.projects[]? | select(.name | test("bibit-operacao")) | .id' | head -n1)
            [ -n "$PROJECT_ID" ] && ORG_ID=$(echo "$PROJS" | jq -r '.projects[0].accountId // empty')
          fi
          echo "resolvido: org=$ORG_ID projeto=$PROJECT_ID" | tee -a $LOG
          if [ -z "$PROJECT_ID" ]; then
            echo "ERRO: projeto bibit-operacao nao encontrado com este token" | tee -a $LOG
            exit 1
          fi
          echo "VERCEL_ORG_ID=$ORG_ID" >> $GITHUB_ENV
          echo "VERCEL_PROJECT_ID=$PROJECT_ID" >> $GITHUB_ENV

      - name: Garantir CLICKUP_TOKEN valido
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          AUTH="Authorization: Bearer $VERCEL_TOKEN"
          LOG=/tmp/token.log
          testa() { curl -s -o /dev/null -w "%{http_code}" "https://api.clickup.com/api/v2/list/901712531318/task?page=0" -H "Authorization: $1"; }
          # 1) situacao atual da env deste projeto
          ENVS=$(curl -s "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_ORG_ID" -H "$AUTH")
          EID=$(echo "$ENVS" | jq -r '.envs[]? | select(.key=="CLICKUP_TOKEN") | .id' | head -n1)
          ATUAL=""
          [ -n "$EID" ] && ATUAL=$(curl -s "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env/$EID?teamId=$VERCEL_ORG_ID&decrypt=true" -H "$AUTH" | jq -r '.value // empty')
          echo "env atual: ${#ATUAL} chars | teste ClickUp: $(testa "$ATUAL")" | tee -a $LOG
          if [ "$(testa "$ATUAL")" = "200" ]; then echo "token atual OK" | tee -a $LOG; exit 0; fi
          # 2) varrer projetos irmaos por um token que PASSE no teste
          BOM=""
          PROJS=$(curl -s "https://api.vercel.com/v9/projects?teamId=$VERCEL_ORG_ID&limit=100" -H "$AUTH" | jq -r '.projects[] | "\(.id) \(.name)"')
          while read -r PID PNAME; do
            [ "$PID" = "$VERCEL_PROJECT_ID" ] && continue
            E2=$(curl -s "https://api.vercel.com/v9/projects/$PID/env?teamId=$VERCEL_ORG_ID" -H "$AUTH" | jq -r '.envs[]? | select(.key=="CLICKUP_TOKEN") | .id' | head -n1)
            [ -z "$E2" ] || [ "$E2" = "null" ] && continue
            V2=$(curl -s "https://api.vercel.com/v9/projects/$PID/env/$E2?teamId=$VERCEL_ORG_ID&decrypt=true" -H "$AUTH" | jq -r '.value // empty')
            C2=$(testa "$V2")
            echo "irmao $PNAME: ${#V2} chars | teste: $C2" | tee -a $LOG
            if [ "$C2" = "200" ]; then BOM="$V2"; echo "::add-mask::$BOM"; echo "token valido achado em: $PNAME" | tee -a $LOG; break; fi
          done <<< "$PROJS"
          if [ -z "$BOM" ]; then echo "NENHUM irmao tem token valido — pedir ao Bruno o token do ClickUp" | tee -a $LOG; exit 0; fi
          # 3) regravar a env deste projeto com o token valido
          [ -n "$EID" ] && curl -s -X DELETE "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env/$EID?teamId=$VERCEL_ORG_ID" -H "$AUTH" > /dev/null
          curl -s -X POST "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_ORG_ID" -H "$AUTH" -H "Content-Type: application/json" \
            -d "{\"key\":\"CLICKUP_TOKEN\",\"value\":\"$BOM\",\"type\":\"encrypted\",\"target\":[\"production\",\"preview\",\"development\"]}" | jq -r 'if .created then "env regravada com token valido" else (.error.message // "erro ao gravar") end' | tee -a $LOG

      - name: Deploy producao
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -e
          set -o pipefail
          npx vercel@latest pull --yes --environment=production --token=$VERCEL_TOKEN 2>&1 | tee -a /tmp/deploy.log
          npx vercel@latest deploy --prod --yes --token=$VERCEL_TOKEN 2>&1 | tee -a /tmp/deploy.log

      - name: Testar e registrar resultado
        if: always()
        run: |
          sleep 10
          DIAG=$(curl -s --max-time 20 "https://qualidadebibitmkt-bibit-operacao.vercel.app/api/clickup?diag=1" || echo "sem resposta")
          PROXY=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "https://qualidadebibitmkt-bibit-operacao.vercel.app/api/clickup?path=list%2F901712531318%2Ftask%3Fpage%3D0" || echo 000); echo "proxy real: $PROXY" >> /tmp/token.log; RAIZ=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "https://qualidadebibitmkt-bibit-operacao.vercel.app/" || echo "000")
          printf 'diag: %s\nraiz: %s\nvercel_auth: %s\ndata: %s\n' "$DIAG" "$RAIZ" "${vercel_auth_http:-?}" "$(date -u +%FT%TZ)" | tee deploy-status.txt; { echo '--- quem ---'; cat /tmp/quem.txt 2>/dev/null; echo '--- resolucao ---'; cat /tmp/resolve.log 2>/dev/null || echo 'sem resolucao'; echo '--- log do deploy (fim) ---'; tail -c 1500 /tmp/deploy.log 2>/dev/null || echo 'sem log'; } >> deploy-status.txt
          git config user.name "deploy-bot"; git config user.email "bot@bibit"
          git add deploy-status.txt
          git commit -m "status do deploy [skip ci]" || true
          git push || true
