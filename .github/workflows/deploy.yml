name: Deploy Vercel
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checar token Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          CODE=$(curl -s -o /tmp/auth.json -w "%{http_code}" "https://api.vercel.com/v2/user" -H "Authorization: Bearer $VERCEL_TOKEN")
          echo "vercel_auth_http=$CODE" >> $GITHUB_ENV
          echo "auth HTTP: $CODE"
          head -c 200 /tmp/auth.json; echo

      - name: Resolver time e projeto
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          AUTH="Authorization: Bearer $VERCEL_TOKEN"
          LOG=/tmp/resolve.log
          TEAMS=$(curl -s "https://api.vercel.com/v2/teams?limit=100" -H "$AUTH")
          echo "times: $(echo "$TEAMS" | jq -r '[.teams[]?.slug] | join(",")')" | tee -a $LOG
          ORG_ID=$(echo "$TEAMS" | jq -r '.teams[]? | select(.slug=="bibit-marketing") | .id')
          [ -z "$ORG_ID" ] && ORG_ID=$(echo "$TEAMS" | jq -r '.teams[0]?.id // empty')
          PROJECT_ID=""
          if [ -n "$ORG_ID" ]; then
            PROJS=$(curl -s "https://api.vercel.com/v9/projects?teamId=$ORG_ID&search=bibit-operacao" -H "$AUTH")
            PROJECT_ID=$(echo "$PROJS" | jq -r '.projects[]? | select(.name | test("bibit-operacao")) | .id' | head -n1)
          fi
          if [ -z "$PROJECT_ID" ]; then
            PROJS=$(curl -s "https://api.vercel.com/v9/projects?search=bibit-operacao" -H "$AUTH")
            PROJECT_ID=$(echo "$PROJS" | jq -r '.projects[]? | select(.name | test("bibit-operacao")) | .id' | head -n1)
            [ -n "$PROJECT_ID" ] && ORG_ID=$(echo "$PROJS" | jq -r '.projects[0].accountId // empty')
          fi
          echo "resolvido: org=$ORG_ID projeto=$PROJECT_ID" | tee -a $LOG
          if [ -z "$PROJECT_ID" ]; then
            echo "ERRO: projeto bibit-operacao nao encontrado com este token" | tee -a $LOG
            exit 1
          fi
          echo "VERCEL_ORG_ID=$ORG_ID" >> $GITHUB_ENV
          echo "VERCEL_PROJECT_ID=$PROJECT_ID" >> $GITHUB_ENV

      - name: Garantir CLICKUP_TOKEN no projeto
        continue-on-error: true   # guarda de env não pode derrubar o deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -e
          AUTH="Authorization: Bearer $VERCEL_TOKEN"
          HAS=$(curl -s "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_ORG_ID" -H "$AUTH" | jq -r '[.envs[]? | select(.key=="CLICKUP_TOKEN")] | length')
          echo "CLICKUP_TOKEN ja existe? $HAS"
          if [ "$HAS" -ge 1 ]; then exit 0; fi
          PROJS=$(curl -s "https://api.vercel.com/v9/projects?teamId=$VERCEL_ORG_ID&limit=100" -H "$AUTH" | jq -r '.projects[] | "\(.id) \(.name)"')
          echo "projetos no time:"; echo "$PROJS"
          while read -r PID PNAME; do
            [ "$PID" = "$VERCEL_PROJECT_ID" ] && continue
            EID=$(curl -s "https://api.vercel.com/v9/projects/$PID/env?teamId=$VERCEL_ORG_ID" -H "$AUTH" | jq -r '.envs[]? | select(.key=="CLICKUP_TOKEN") | .id' | head -n1)
            if [ -n "$EID" ] && [ "$EID" != "null" ]; then
              VAL=$(curl -s "https://api.vercel.com/v9/projects/$PID/env/$EID?teamId=$VERCEL_ORG_ID&decrypt=true" -H "$AUTH" | jq -r '.value // empty')
              if [ -n "$VAL" ]; then
                echo "::add-mask::$VAL"
                echo "copiando CLICKUP_TOKEN do projeto: $PNAME"
                curl -s -X POST "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_ORG_ID" -H "$AUTH" -H "Content-Type: application/json" \
                  -d "{\"key\":\"CLICKUP_TOKEN\",\"value\":\"$VAL\",\"type\":\"encrypted\",\"target\":[\"production\",\"preview\",\"development\"]}" \
                  | jq -r 'if .created then "env criada com sucesso" else (.error.message // "resposta inesperada") end'
                exit 0
              fi
            fi
          done <<< "$PROJS"
          echo "AVISO: nao achei CLICKUP_TOKEN em nenhum projeto irmao — diag vai responder VAZIO"

      - name: Deploy producao
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -e
          set -o pipefail
          npx vercel@latest pull --yes --environment=production --token=$VERCEL_TOKEN 2>&1 | tee -a /tmp/deploy.log
          npx vercel@latest deploy --prod --yes --token=$VERCEL_TOKEN 2>&1 | tee -a /tmp/deploy.log

      - name: Testar e registrar resultado
        if: always()
        run: |
          sleep 10
          DIAG=$(curl -s --max-time 20 "https://qualidadebibitmkt-bibit-operacao.vercel.app/api/clickup?diag=1" || echo "sem resposta")
          RAIZ=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "https://qualidadebibitmkt-bibit-operacao.vercel.app/" || echo "000")
          printf 'diag: %s\nraiz: %s\nvercel_auth: %s\ndata: %s\n' "$DIAG" "$RAIZ" "${vercel_auth_http:-?}" "$(date -u +%FT%TZ)" | tee deploy-status.txt; { echo '--- resolucao ---'; cat /tmp/resolve.log 2>/dev/null || echo 'sem resolucao'; echo '--- log do deploy (fim) ---'; tail -c 1500 /tmp/deploy.log 2>/dev/null || echo 'sem log'; } >> deploy-status.txt
          git config user.name "deploy-bot"; git config user.email "bot@bibit"
          git add deploy-status.txt
          git commit -m "status do deploy [skip ci]" || true
          git push || true
