name: Diag Vendas
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extrair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair vendas do ClickUp
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -e
          AUTH="Authorization: Bearer $VERCEL_TOKEN"
          ORG_ID=$(curl -s "https://api.vercel.com/v2/teams?limit=100" -H "$AUTH" | jq -r '.teams[] | select(.slug=="bibit-marketing") | .id')
          npx vercel@latest pull --yes --environment=production --token=$VERCEL_TOKEN --scope=$ORG_ID > /dev/null 2>&1 || npx vercel@latest pull --yes --environment=production --token=$VERCEL_TOKEN > /dev/null 2>&1
          CT=$(grep -oP 'CLICKUP_TOKEN="?\K[^"\n]+' .vercel/.env.production.local | head -n1)
          [ -z "$CT" ] && { echo "sem CLICKUP_TOKEN"; exit 1; }
          curl -s "https://api.clickup.com/api/v2/list/901713519081/task?include_closed=true&subtasks=true&page=0" \
            -H "Authorization: $CT" -o /tmp/vendas.json
          jq '[.tasks[] | {id, parent, name, status: .status.status,
                criada: .date_created, fechada: .date_closed, concluida: .date_done, venc: .due_date,
                valor: ([.custom_fields[]? | select(.id=="01454349-1cb6-4e8a-a665-7d7e74420d64") | .value][0]),
                dataPag: ([.custom_fields[]? | select(.id=="435d3c37-e413-4362-9c21-bdba5b6473d0") | .value][0])}]' \
            /tmp/vendas.json > diag-vendas.json
          echo "linhas: $(jq length diag-vendas.json)"
          git config user.name diag-bot; git config user.email bot@bibit
          git add diag-vendas.json
          git commit -m "diag: dump da lista de vendas [skip ci]" || true
          git push
